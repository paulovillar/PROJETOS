<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- APP:START -->
<title>Velha com a Elisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
  :root {
    --paper: #eef3f6;
    --grid: rgba(56, 110, 160, 0.13);
    --margin: rgba(210, 56, 63, 0.35);
    --ink: #1d2a3a;
    --ink-soft: #57677a;
    --card: #ffffff;
    --line: #d5dfe8;
    --x: #d2383f;
    --o: #2459c9;
    --win: rgba(247, 206, 70, 0.45);
    --btn: #1d2a3a;
    --btn-ink: #ffffff;
    --ok: #1f8a4c;
    --warn: #b7791f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111922;
      --grid: rgba(140, 180, 220, 0.08);
      --margin: rgba(255, 107, 111, 0.28);
      --ink: #e4ecf4;
      --ink-soft: #93a4b7;
      --card: #18222e;
      --line: #2a3848;
      --x: #ff6b6f;
      --o: #7aa6ff;
      --win: rgba(247, 206, 70, 0.18);
      --btn: #e4ecf4;
      --btn-ink: #111922;
      --ok: #4cc47f;
      --warn: #e0a84a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #111922;
    --grid: rgba(140, 180, 220, 0.08);
    --margin: rgba(255, 107, 111, 0.28);
    --ink: #e4ecf4;
    --ink-soft: #93a4b7;
    --card: #18222e;
    --line: #2a3848;
    --x: #ff6b6f;
    --o: #7aa6ff;
    --win: rgba(247, 206, 70, 0.18);
    --btn: #e4ecf4;
    --btn-ink: #111922;
    --ok: #4cc47f;
    --warn: #e0a84a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 24px 40px;
    color: var(--ink);
    font: 15px/1.5 "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
  }
  .wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header h1 {
    margin: 0;
    font: 400 2.6rem/1 "Gochi Hand", "Comic Sans MS", cursive;
    text-wrap: balance;
  }
  header h1 .x { color: var(--x); }
  header h1 .o { color: var(--o); }
  header p { margin: 6px 0 0; color: var(--ink-soft); }

  .players { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; }
  .player {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 2px;
    transition: border-color .2s;
    min-width: 0;
  }
  .player.turn { border-color: currentColor; }
  .player.px { color: var(--x); }
  .player.po { color: var(--o); text-align: right; }
  .player .who { color: var(--ink); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .player .pts { font: 400 2rem/1 "Gochi Hand", cursive; font-variant-numeric: tabular-nums; }
  .draws { align-self: center; text-align: center; color: var(--ink-soft); font-size: 12px; }
  .draws b { display: block; font: 400 1.5rem/1 "Gochi Hand", cursive; color: var(--ink); }

  .status {
    min-height: 1.6em;
    text-align: center;
    font: 400 1.6rem/1.2 "Gochi Hand", cursive;
  }

  .board-wrap { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; }
  .board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .grid-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .grid-lines path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
  .cell {
    appearance: none; border: 0; background: transparent; padding: 10%;
    cursor: pointer; border-radius: 10px; color: inherit;
    transition: background-color .15s;
  }
  .cell:disabled { cursor: default; }
  .cell:not(:disabled):hover { background: var(--grid); }
  .cell:focus-visible { outline: 3px solid var(--o); outline-offset: -6px; }
  .cell.win { background: var(--win); }
  .cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .cell svg * { fill: none; stroke-width: 9; stroke-linecap: round; }
  .cell svg.mx * { stroke: var(--x); }
  .cell svg.mo * { stroke: var(--o); }
  .cell svg.fresh * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .28s ease-out forwards; }
  .cell svg.fresh .second { animation-delay: .18s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    appearance: none; border: 2px solid var(--btn); border-radius: 999px;
    padding: 9px 18px; font: 700 14px/1 "Nunito Sans", system-ui, sans-serif;
    background: var(--btn); color: var(--btn-ink); cursor: pointer;
  }
  button.btn.ghost { background: transparent; color: var(--ink); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn:focus-visible, input:focus-visible { outline: 3px solid var(--o); outline-offset: 2px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel h2 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1 1 140px; min-width: 0; }
  input[type="text"] {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink-soft);
    font: 400 1.3rem/1 "Gochi Hand", cursive; padding: 6px 16px; cursor: pointer;
  }
  .seg button[aria-pressed="true"].sx { background: var(--x); color: #fff; }
  .seg button[aria-pressed="true"].so { background: var(--o); color: #fff; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.wait { background: var(--warn); }
  .link {
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--paper); border: 1px dashed var(--line); border-radius: 8px;
    padding: 8px 10px; overflow-wrap: anywhere; user-select: all;
  }
  .hint { margin: 0; font-size: 13px; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    .cell svg.fresh * { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jogo da <span class="x">ve</span><span class="o">lha</span></h1>
    <p id="subtitle">Uma partida ao vivo, cada um no seu aparelho.</p>
  </header>

  <section class="players" aria-label="Placar">
    <div class="player px" id="pX">
      <span class="tag">✕ joga</span>
      <span class="who" id="nameX">—</span>
      <span class="pts" id="scoreX">0</span>
    </div>
    <div class="draws">velhas<b id="scoreD">0</b></div>
    <div class="player po" id="pO">
      <span class="tag">◯ joga</span>
      <span class="who" id="nameO">—</span>
      <span class="pts" id="scoreO">0</span>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite">Carregando…</div>

  <div class="board-wrap">
    <svg class="grid-lines" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M101 8 C 98 90, 103 200, 99 292"/>
      <path d="M200 10 C 203 110, 197 210, 201 290"/>
      <path d="M8 99 C 90 102, 200 96, 292 101"/>
      <path d="M10 201 C 110 198, 210 204, 290 199"/>
    </svg>
    <div class="board" id="board" role="grid" aria-label="Tabuleiro"></div>
  </div>

  <div class="actions">
    <button class="btn" id="btnNew" type="button">Nova partida</button>
    <button class="btn ghost" id="btnReset" type="button">Zerar placar</button>
  </div>
  <div class="actions" id="confirmReset" hidden>
    <span class="hint">Zerar o placar para os dois?</span>
    <button class="btn" id="btnResetYes" type="button">Zerar</button>
    <button class="btn ghost" id="btnResetNo" type="button">Cancelar</button>
  </div>

  <section class="panel" aria-label="Você">
    <h2>Você</h2>
    <div class="row">
      <input type="text" id="myName" maxlength="24" placeholder="Seu nome" autocomplete="nickname">
      <div class="seg" role="group" aria-label="Seu símbolo">
        <button type="button" class="sx" id="symX" aria-pressed="false">✕</button>
        <button type="button" class="so" id="symO" aria-pressed="false">◯</button>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Conexão">
    <h2>Conexão</h2>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Conectando…</span></div>
    <div id="p2pBox" hidden>
      <div class="row" id="p2pLobby">
        <button class="btn" id="btnHost" type="button">Criar sala</button>
        <input type="text" id="joinCode" maxlength="8" placeholder="Código da sala" autocomplete="off">
        <button class="btn ghost" id="btnJoin" type="button">Entrar</button>
      </div>
      <div id="p2pShare" hidden>
        <p class="hint">Mande este link para a Elisa:</p>
        <div class="row">
          <div class="link" id="shareLink"></div>
          <button class="btn ghost" id="btnCopy" type="button">Copiar</button>
        </div>
      </div>
    </div>
    <p class="hint" id="connHint"></p>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ---------- regras ----------
  const EMPTY = ".........";
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const other = s => (s === "X" ? "O" : "X");

  function outcome(b) {
    for (const l of LINES) {
      const [a, c, d] = l;
      if (b[a] !== "." && b[a] === b[c] && b[a] === b[d]) return { w: b[a], line: l };
    }
    return b.includes(".") ? null : { w: "D", line: [] };
  }

  const freshGame = (seq = 0, starter = "X", sc = { X: 0, O: 0, D: 0 }) =>
    ({ b: EMPTY, turn: starter, starter, seq, sc: { ...sc } });

  function validGame(g) {
    return g && typeof g === "object"
      && typeof g.b === "string" && /^[XO.]{9}$/.test(g.b)
      && (g.turn === "X" || g.turn === "O")
      && (g.starter === "X" || g.starter === "O")
      && Number.isInteger(g.seq) && g.seq >= 0
      && g.sc && ["X", "O", "D"].every(k => Number.isInteger(g.sc[k]) && g.sc[k] >= 0);
  }

  // Estado mais avançado vence; empate de seq desempata de forma determinística.
  const newer = (a, b) => a.seq > b.seq || (a.seq === b.seq && JSON.stringify(a) > JSON.stringify(b));

  // ---------- armazenamento local (conveniência) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("velha." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("velha." + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- estado ----------
  let game = store.get("game", null);
  if (!validGame(game)) game = freshGame();
  const me = { name: store.get("name", ""), sym: store.get("sym", null) };
  let others = [];            // [{id, name, sym, g, guest}]
  let transport = null;       // {kind, publish(obj), winsTie(id)}
  let lastBoard = game.b;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const boardEl = $("board");
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cell";
    btn.setAttribute("role", "gridcell");
    btn.addEventListener("click", () => play(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }
  const markSvg = (s, fresh) => s === "X"
    ? `<svg viewBox="0 0 100 100" class="mx${fresh ? " fresh" : ""}"><path pathLength="1" d="M20 22 Q50 48 80 78"/><path class="second" pathLength="1" d="M79 20 Q52 50 21 80"/></svg>`
    : `<svg viewBox="0 0 100 100" class="mo${fresh ? " fresh" : ""}"><path pathLength="1" d="M52 18 C 24 16, 16 44, 20 60 C 25 80, 50 86, 66 78 C 84 68, 86 40, 74 27 C 66 19, 56 17, 46 20"/></svg>`;

  $("myName").value = me.name;

  // ---------- helpers de jogadores ----------
  const opponent = () => others.find(o => o.sym && o.sym !== me.sym) || others[0] || null;
  function nameFor(sym) {
    if (transport?.kind === "local") return sym === "X" ? "Jogador ✕" : "Jogador ◯";
    if (me.sym === sym) return (me.name || "Você") + " (você)";
    const o = others.find(p => p.sym === sym);
    return o ? o.name || "Adversário" : "Aguardando…";
  }

  // ---------- render ----------
  function render() {
    const out = outcome(game.b);
    const local = transport?.kind === "local";
    const canMove = !out && (local || (me.sym && game.turn === me.sym));

    game.b.split("").forEach((c, i) => {
      const cell = cells[i];
      const fresh = c !== "." && lastBoard[i] !== c;
      if (c === ".") {
        if (cell.firstChild) cell.innerHTML = "";
      } else if (fresh || !cell.firstChild) {
        cell.innerHTML = markSvg(c, fresh);
      }
      cell.disabled = c !== "." || !canMove;
      cell.classList.toggle("win", !!out && out.line.includes(i));
      cell.setAttribute("aria-label", `Casa ${i + 1}: ${c === "." ? "vazia" : c === "X" ? "xis" : "bola"}`);
    });
    lastBoard = game.b;

    $("nameX").textContent = nameFor("X");
    $("nameO").textContent = nameFor("O");
    $("scoreX").textContent = game.sc.X;
    $("scoreO").textContent = game.sc.O;
    $("scoreD").textContent = game.sc.D;
    $("pX").classList.toggle("turn", !out && game.turn === "X");
    $("pO").classList.toggle("turn", !out && game.turn === "O");

    let msg;
    if (out) {
      if (out.w === "D") msg = "Deu velha!";
      else if (local) msg = `${out.w === "X" ? "✕" : "◯"} venceu!`;
      else msg = out.w === me.sym ? "Você venceu! 🎉" : `${nameFor(out.w)} venceu`;
    } else if (local) {
      msg = `Vez do ${game.turn === "X" ? "✕" : "◯"}`;
    } else if (!me.sym) {
      msg = "Escolha ✕ ou ◯ abaixo";
    } else if (game.turn === me.sym) {
      msg = "Sua vez";
    } else {
      const opp = others.find(p => p.sym === game.turn);
      msg = opp ? `Vez de ${opp.name || "seu adversário"}` : "Aguardando a Elisa entrar…";
    }
    $("status").textContent = msg;
    $("btnNew").textContent = out ? "Nova partida" : "Reiniciar partida";

    $("symX").setAttribute("aria-pressed", String(me.sym === "X"));
    $("symO").setAttribute("aria-pressed", String(me.sym === "O"));
  }

  // ---------- mudanças de estado ----------
  function publish() {
    store.set("game", game);
    transport?.publish({ v: 1, name: me.name.slice(0, 24), sym: me.sym, g: game });
  }

  function commit(next) {
    game = next;
    publish();
    render();
  }

  function play(i) {
    if (game.b[i] !== "." || outcome(game.b)) return;
    const local = transport?.kind === "local";
    if (!local && game.turn !== me.sym) return;
    const b = game.b.slice(0, i) + game.turn + game.b.slice(i + 1);
    const out = outcome(b);
    const sc = { ...game.sc };
    if (out) sc[out.w] += 1;
    commit({ ...game, b, turn: other(game.turn), seq: game.seq + 1, sc });
  }

  $("btnNew").addEventListener("click", () => {
    const starter = outcome(game.b) ? other(game.starter) : game.starter;
    commit(freshGame(game.seq + 1, starter, game.sc));
  });
  $("btnReset").addEventListener("click", () => { $("confirmReset").hidden = false; });
  $("btnResetNo").addEventListener("click", () => { $("confirmReset").hidden = true; });
  $("btnResetYes").addEventListener("click", () => {
    $("confirmReset").hidden = true;
    commit(freshGame(game.seq + 1, "X"));
  });

  let nameTimer;
  $("myName").addEventListener("input", e => {
    me.name = e.target.value.trim();
    store.set("name", me.name);
    render();
    clearTimeout(nameTimer);
    nameTimer = setTimeout(publish, 400);
  });

  function setSym(s) {
    me.sym = s;
    store.set("sym", s);
    publish();
    render();
  }
  $("symX").addEventListener("click", () => setSym("X"));
  $("symO").addEventListener("click", () => setSym("O"));

  // Recebe a presença dos outros e reconcilia estado e símbolos.
  function receiveOthers(list) {
    others = list.map(p => ({
      id: p.id,
      guest: !!p.guest,
      name: typeof p.name === "string" ? p.name.slice(0, 24) : "",
      sym: p.sym === "X" || p.sym === "O" ? p.sym : null,
      g: validGame(p.g) ? p.g : null,
    }));

    let changed = false;
    for (const o of others) {
      if (o.g && newer(o.g, game)) { game = o.g; changed = true; }
    }

    // Atribuição automática de símbolo / resolução de conflito.
    const taken = others.filter(o => o.sym).map(o => o.sym);
    if (!me.sym && others.length) {
      me.sym = taken.includes("X") ? "O" : "X";
      store.set("sym", me.sym);
      changed = true;
    } else if (me.sym) {
      const clash = others.find(o => o.sym === me.sym);
      if (clash && !taken.includes(other(me.sym)) && !transport.winsTie(clash.id)) {
        me.sym = other(me.sym);
        store.set("sym", me.sym);
        changed = true;
      }
    }

    if (changed) publish();
    render();
  }

  // ---------- conexão ----------
  function setConn(state, text, hint = "") {
    $("connDot").className = "dot" + (state === "ok" ? " ok" : state === "wait" ? " wait" : "");
    $("connText").textContent = text;
    $("connHint").textContent = hint;
  }

  function describePeers() {
    if (!others.length) return "Só você aqui por enquanto";
    const names = others.map(o => o.name || "alguém").join(", ");
    return `Jogando com ${names}`;
  }

  // 1) Dentro do claude.ai: capability "room" (presença em tempo real).
  async function tryRoom() {
    const room = await window.claude?.use?.("room");
    if (!room) return false;
    let myPeer = null;
    transport = {
      kind: "room",
      publish: obj => { room.presence(obj).catch(() => {}); },
      winsTie: id => (myPeer ?? "") < id,
    };
    $("subtitle").textContent = "Abram esta mesma página, cada um no seu aparelho.";
    room.onConnection(ok => {
      setConn(ok ? "ok" : "wait", ok ? describePeers() : "Reconectando…");
    });
    room.onPeers(ch => {
      const mine = ch.peers.find(p => p.sameTab);
      if (mine) myPeer = mine.peer;
      receiveOthers(ch.peers
        .filter(p => !p.sameTab && p.kind === "viewer")
        .map(p => ({ id: p.peer, guest: p.guest, ...p.presence })));
      if (room.connected()) setConn("ok", describePeers());
    }, () => {
      setConn("off", "Sem conexão com a sala", "Vocês ainda podem jogar no mesmo aparelho.");
      goLocal();
    });
    publish();
    return true;
  }

  // 2) Página hospedada (GitHub Pages etc.): WebRTC via PeerJS.
  const PEER_PREFIX = "velha-elisa-";
  function loadPeerJs() {
    return new Promise((resolve, reject) => {
      if (window.Peer) return resolve(window.Peer);
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
      s.onload = () => (window.Peer ? resolve(window.Peer) : reject(new Error("PeerJS indisponível")));
      s.onerror = () => reject(new Error("PeerJS indisponível"));
      document.head.appendChild(s);
    });
  }

  const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(5)),
    n => "abcdefghjkmnpqrstuvwxyz23456789"[n % 31]).join("");

  function shareUrl(code) {
    const u = new URL(location.href);
    u.hash = code;
    return u.toString();
  }

  async function startP2P() {
    let Peer;
    try { Peer = await loadPeerJs(); }
    catch { return false; }

    $("p2pBox").hidden = false;
    const conns = new Map();         // peerId -> {conn, presence}
    let isHost = false;
    let peer = null;
    let latest = null;

    const syncOthers = () => receiveOthers([...conns.values()]
      .filter(c => c.presence)
      .map(c => ({ id: c.conn.peer, ...c.presence })));

    transport = {
      kind: "p2p",
      publish: obj => {
        latest = obj;
        for (const { conn } of conns.values()) if (conn.open) conn.send(obj);
      },
      winsTie: () => isHost,
    };

    function wire(conn) {
      conns.set(conn.peer, { conn, presence: null });
      conn.on("open", () => {
        if (latest) conn.send(latest);
        setConn("ok", "Conectados");
      });
      conn.on("data", data => {
        const entry = conns.get(conn.peer);
        if (!entry || !data || typeof data !== "object") return;
        entry.presence = data;
        syncOthers();
        setConn("ok", describePeers());
      });
      conn.on("close", () => {
        conns.delete(conn.peer);
        syncOthers();
        if (isHost) setConn("wait", "Sala aberta", "Esperando a Elisa abrir o link.");
        else setConn("off", "Conexão perdida", "Recarregue a página para reconectar.");
      });
    }

    function host(code, attempt = 0) {
      isHost = true;
      store.set("hostCode", code);
      peer?.destroy();
      peer = new Peer(PEER_PREFIX + code);
      setConn("wait", "Abrindo a sala…");
      peer.on("open", () => {
        $("p2pLobby").hidden = true;
        $("p2pShare").hidden = false;
        $("shareLink").textContent = shareUrl(code);
        if (location.hash.slice(1) !== code) history.replaceState(null, "", "#" + code);
        setConn("wait", `Sala ${code} aberta`, "Esperando a Elisa abrir o link.");
      });
      peer.on("connection", wire);
      peer.on("error", err => {
        if (err.type === "unavailable-id" && attempt < 3) {
          // O servidor ainda guarda o id da sessão anterior; tenta de novo.
          setTimeout(() => host(code, attempt + 1), 3000);
        } else if (err.type === "unavailable-id") {
          host(makeCode());
        } else {
          setConn("off", "Erro de conexão", String(err.type || err.message || err));
        }
      });
    }

    function join(code) {
      isHost = false;
      peer?.destroy();
      peer = new Peer();
      setConn("wait", `Entrando na sala ${code}…`);
      peer.on("open", () => {
        wire(peer.connect(PEER_PREFIX + code, { reliable: true }));
        if (location.hash.slice(1) !== code) history.replaceState(null, "", "#" + code);
      });
      peer.on("error", err => {
        if (err.type === "peer-unavailable") {
          setConn("off", "Sala não encontrada", "Confira o código ou peça um link novo.");
        } else {
          setConn("off", "Erro de conexão", String(err.type || err.message || err));
        }
      });
    }

    $("btnHost").addEventListener("click", () => host(makeCode()));
    $("btnJoin").addEventListener("click", () => {
      const code = $("joinCode").value.trim().toLowerCase();
      if (code) join(code);
    });
    $("btnCopy").addEventListener("click", () => {
      const text = $("shareLink").textContent;
      navigator.clipboard?.writeText(text).then(
        () => { $("btnCopy").textContent = "Copiado"; setTimeout(() => ($("btnCopy").textContent = "Copiar"), 1500); },
        () => getSelection().selectAllChildren($("shareLink"))
      );
    });

    const code = location.hash.slice(1).toLowerCase();
    if (/^[a-z0-9]{4,8}$/.test(code)) {
      if (store.get("hostCode", null) === code) host(code);
      else join(code);
    } else {
      setConn("wait", "Sem sala", "Crie uma sala e mande o link, ou digite o código que recebeu.");
    }
    return true;
  }

  // 3) Sem rede: os dois jogam no mesmo aparelho.
  function goLocal() {
    transport = { kind: "local", publish: () => {}, winsTie: () => true };
    others = [];
    render();
  }

  async function boot() {
    render();
    if (window.claude?.use) {
      if (await tryRoom()) return;
      setConn("off", "Modo local", "A sala ao vivo não está disponível aqui; joguem no mesmo aparelho.");
      goLocal();
      return;
    }
    if (await startP2P()) { render(); return; }
    setConn("off", "Modo local", "Não deu para carregar o módulo online; joguem no mesmo aparelho.");
    goLocal();
  }

  boot();
})();
</script>
